name: verify-firstrade-domains

on:
  push:
    paths:
      - "requirements.txt"
  pull_request:
    paths:
      - "requirements.txt"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/verify_firstrade_domains.py
