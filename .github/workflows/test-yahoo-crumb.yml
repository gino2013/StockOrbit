name: test-yahoo-crumb
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Yahoo quoteSummary crumb
        run: |
          pip install yfinance
          python3 -c "
          import yfinance as yf
          info = yf.Ticker('AAPL').get_info()
          print('key count:', len(info))
          print('trailingPE:', info.get('trailingPE'))
          "
