<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>註冊 · StockOrbit</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script>
  document.documentElement.setAttribute('data-theme',
    localStorage.theme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
</script>
<style>body { font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }</style>
</head>
<body class="bg-base-200 min-h-screen flex items-center justify-center p-4">
  <div class="card bg-base-100 shadow-lg w-full max-w-sm">
    <div class="card-body">
      <h1 class="text-xl font-bold">註冊 StockOrbit</h1>
      {% if error %}<div class="alert alert-error text-sm py-2">{{ error }}</div>{% endif %}
      <form method="post" action="/register" class="flex flex-col gap-3 mt-2">
        <label class="text-sm">Email
          <input name="email" type="email" required autofocus class="input input-bordered w-full mt-1">
        </label>
        <label class="text-sm">密碼（至少 8 個字元）
          <input name="password" type="password" minlength="8" required class="input input-bordered w-full mt-1">
        </label>
        <button type="submit" class="btn btn-primary mt-1">建立帳號</button>
      </form>
      <p class="text-sm opacity-70 mt-2">已經有帳號？<a href="/login" class="link">登入</a></p>
    </div>
  </div>
</body>
</html>
