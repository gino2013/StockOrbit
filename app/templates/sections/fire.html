  <h2 id="section-fire" class="flex items-center gap-2 text-lg font-bold mb-3">
    <span class="w-1.5 h-5 bg-primary rounded-full"></span>FIRE 進度
  </h2>
  <div class="card bg-base-100 shadow-sm mb-8">
    <div class="card-body">
      <p class="text-xs opacity-60">輸入年支出跟安全提領率（預設 4% 法則），算出財務獨立所需的市值（FIRE 數字 = 年支出 ÷ 提領率），追蹤目前進度。另外填退休日期跟預期報酬率可以算 Coast FIRE：今天不再投入，靠複利能不能長到 FIRE 數字。</p>
      <form id="fire-form" class="flex flex-wrap gap-3 items-end mt-2">
        <label class="text-sm">年支出<br>
          <input name="annual_expenses" type="number" min="1" step="any" placeholder="800000" required class="input input-bordered input-sm mt-1 w-40">
        </label>
        <label class="text-sm">安全提領率<br>
          <input name="swr" type="number" min="0.02" max="0.10" step="0.001" placeholder="0.04" class="input input-bordered input-sm mt-1 w-32">
        </label>
        <label class="text-sm">退休日期（選填，算 Coast FIRE）<br>
          <input name="retirement_date" type="date" class="input input-bordered input-sm mt-1 w-40">
        </label>
        <label class="text-sm">預期實質報酬率（選填）<br>
          <input name="expected_real_return" type="number" min="-0.20" max="0.20" step="0.001" placeholder="0.05" class="input input-bordered input-sm mt-1 w-32">
        </label>
        <button type="submit" class="btn btn-neutral btn-sm">設定</button>
        <button type="button" onclick="deleteFire()" id="fire-delete-btn" class="btn btn-ghost btn-sm hidden">清除</button>
      </form>
      <div id="fire-content" class="mt-3"></div>
    </div>
  </div>

<script>
async function loadFire() {
  const content = document.getElementById('fire-content');
  const deleteBtn = document.getElementById('fire-delete-btn');
  const res = await fetch('/api/fire');
  const data = await res.json();
  if (!data.fire) {
    content.innerHTML = '';
    deleteBtn.classList.add('hidden');
    return;
  }
  const f = data.fire;
  deleteBtn.classList.remove('hidden');
  document.querySelector('#fire-form input[name=annual_expenses]').value = f.annual_expenses;
  document.querySelector('#fire-form input[name=swr]').value = f.swr;
  document.querySelector('#fire-form input[name=retirement_date]').value = f.coast_fire ? f.coast_fire.retirement_date : '';
  document.querySelector('#fire-form input[name=expected_real_return]').value = f.coast_fire ? f.coast_fire.expected_real_return : '';

  const progressPct = (f.progress_pct * 100).toFixed(1);

  let etaStat = '';
  if (f.already_fire) {
    etaStat = `
      <div class="stat">
        <div class="stat-title">狀態</div>
        <div class="stat-value text-lg text-success">已達成 FIRE</div>
      </div>`;
  } else if (f.projected_achievement_date) {
    etaStat = `
      <div class="stat">
        <div class="stat-title">以目前 XIRR 推估達成日期</div>
        <div class="stat-value text-lg">${f.projected_achievement_date}</div>
      </div>`;
  } else {
    etaStat = `
      <div class="stat">
        <div class="stat-title">以目前 XIRR 推估達成日期</div>
        <div class="stat-value text-lg text-error">達不到</div>
        <div class="stat-desc">目前報酬率下市值不會成長到 FIRE 數字</div>
      </div>`;
  }

  let coastHtml = '';
  if (f.coast_fire) {
    const c = f.coast_fire;
    const statusBadge = c.already_coasting
      ? '<span class="badge badge-success badge-sm ml-2">已經可以躺平</span>'
      : '<span class="badge badge-warning badge-sm ml-2">還需要再投入</span>';
    coastHtml = `
    <div class="mt-4 pt-3 border-t border-base-300">
      <div class="text-sm font-medium mb-2">Coast FIRE（${c.retirement_date} 退休，預期實質報酬率 ${fmtPct(c.expected_real_return)}）${statusBadge}</div>
      <div class="stats stats-vertical sm:stats-horizontal shadow w-full bg-base-200">
        <div class="stat">
          <div class="stat-title">今天需要有多少才能躺平</div>
          <div class="stat-value text-lg">$${c.coast_fire_number.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div>
        </div>
        <div class="stat">
          <div class="stat-title">還差</div>
          <div class="stat-value text-lg">$${c.remaining_to_coast.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div>
        </div>
        <div class="stat">
          <div class="stat-title">目前市值退休時的預估值</div>
          <div class="stat-value text-lg">$${c.projected_value_at_retirement.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div>
        </div>
      </div>
    </div>`;
  }

  let dividendHtml = '';
  if (f.dividend_coverage) {
    const d = f.dividend_coverage;
    const coveragePct = d.coverage_pct == null ? null : (d.coverage_pct * 100).toFixed(1);
    const fullBadge = d.coverage_pct != null && d.coverage_pct >= 1
      ? '<span class="badge badge-success badge-sm ml-2">股利已全額覆蓋年支出</span>' : '';
    dividendHtml = `
    <div class="mt-4 pt-3 border-t border-base-300">
      <div class="text-sm font-medium mb-2">股利覆蓋率（Barista / Dividend FIRE）${fullBadge}</div>
      <div class="stats stats-vertical sm:stats-horizontal shadow w-full bg-base-200">
        <div class="stat">
          <div class="stat-title">近 12 個月股利</div>
          <div class="stat-value text-lg">$${d.ttm_dividends.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div>
        </div>
        <div class="stat">
          <div class="stat-title">覆蓋年支出比例</div>
          <div class="stat-value text-lg">${coveragePct == null ? '-' : coveragePct + '%'}</div>
        </div>
        <div class="stat">
          <div class="stat-title">以目前殖利率，全額覆蓋約需本金</div>
          <div class="stat-value text-lg">${d.principal_for_full_coverage == null ? '-' : '$' + d.principal_for_full_coverage.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div>
        </div>
      </div>
    </div>`;
  }

  content.innerHTML = `
    <div class="flex justify-between text-sm mb-1">
      <span>FIRE 數字 $${f.fire_number.toLocaleString('en-US', { maximumFractionDigits: 0 })}（年支出 ÷ ${(f.swr * 100).toFixed(1)}%）</span>
      <span>${progressPct}%</span>
    </div>
    <progress class="progress progress-primary w-full" value="${progressPct}" max="100"></progress>
    <div class="stats stats-vertical sm:stats-horizontal shadow w-full bg-base-200 mt-3">
      <div class="stat">
        <div class="stat-title">目前市值</div>
        <div class="stat-value text-lg">$${f.current_value.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div>
      </div>
      <div class="stat">
        <div class="stat-title">還差</div>
        <div class="stat-value text-lg">$${f.remaining_amount.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div>
      </div>
      <div class="stat">
        <div class="stat-title">目前實際年化報酬率 (XIRR)</div>
        <div class="stat-value text-lg">${f.current_annual_return == null ? '-' : fmtPct(f.current_annual_return)}</div>
      </div>${etaStat}
    </div>${coastHtml}${dividendHtml}`;
}

document.getElementById('fire-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = new FormData(e.target);
  if (!body.get('swr')) body.set('swr', '0.04');
  const res = await fetch('/api/fire', { method: 'POST', body });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  loadFire();
});

async function deleteFire() {
  await fetch('/api/fire/delete', { method: 'POST' });
  document.getElementById('fire-form').reset();
  loadFire();
}

loadFire();
</script>
