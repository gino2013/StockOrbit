  <h2 id="section-fire" class="flex items-center gap-2 text-lg font-bold mb-3">
    <span class="w-1.5 h-5 bg-primary rounded-full"></span>FIRE 進度
  </h2>
  <div class="card bg-base-100 shadow-sm mb-8">
    <div class="card-body">
      <p class="text-xs opacity-60">輸入年支出跟安全提領率（預設 4% 法則），算出財務獨立所需的市值（FIRE 數字 = 年支出 ÷ 提領率），追蹤目前進度。</p>
      <form id="fire-form" class="flex flex-wrap gap-3 items-end mt-2">
        <label class="text-sm">年支出<br>
          <input name="annual_expenses" type="number" min="1" step="any" placeholder="800000" required class="input input-bordered input-sm mt-1 w-40">
        </label>
        <label class="text-sm">安全提領率<br>
          <input name="swr" type="number" min="0.02" max="0.10" step="0.001" placeholder="0.04" class="input input-bordered input-sm mt-1 w-32">
        </label>
        <button type="submit" class="btn btn-neutral btn-sm">設定</button>
        <button type="button" onclick="deleteFire()" id="fire-delete-btn" class="btn btn-ghost btn-sm hidden">清除</button>
      </form>
      <div id="fire-content" class="mt-3"></div>
    </div>
  </div>

<script>
async function loadFire() {
  const content = document.getElementById('fire-content');
  const deleteBtn = document.getElementById('fire-delete-btn');
  const res = await fetch('/api/fire');
  const data = await res.json();
  if (!data.fire) {
    content.innerHTML = '';
    deleteBtn.classList.add('hidden');
    return;
  }
  const f = data.fire;
  deleteBtn.classList.remove('hidden');
  document.querySelector('#fire-form input[name=annual_expenses]').value = f.annual_expenses;
  document.querySelector('#fire-form input[name=swr]').value = f.swr;

  const progressPct = (f.progress_pct * 100).toFixed(1);

  let etaStat = '';
  if (f.already_fire) {
    etaStat = `
      <div class="stat">
        <div class="stat-title">狀態</div>
        <div class="stat-value text-lg text-success">已達成 FIRE</div>
      </div>`;
  } else if (f.projected_achievement_date) {
    etaStat = `
      <div class="stat">
        <div class="stat-title">以目前 XIRR 推估達成日期</div>
        <div class="stat-value text-lg">${f.projected_achievement_date}</div>
      </div>`;
  } else {
    etaStat = `
      <div class="stat">
        <div class="stat-title">以目前 XIRR 推估達成日期</div>
        <div class="stat-value text-lg text-error">達不到</div>
        <div class="stat-desc">目前報酬率下市值不會成長到 FIRE 數字</div>
      </div>`;
  }

  content.innerHTML = `
    <div class="flex justify-between text-sm mb-1">
      <span>FIRE 數字 $${f.fire_number.toLocaleString('en-US', { maximumFractionDigits: 0 })}（年支出 ÷ ${(f.swr * 100).toFixed(1)}%）</span>
      <span>${progressPct}%</span>
    </div>
    <progress class="progress progress-primary w-full" value="${progressPct}" max="100"></progress>
    <div class="stats stats-vertical sm:stats-horizontal shadow w-full bg-base-200 mt-3">
      <div class="stat">
        <div class="stat-title">目前市值</div>
        <div class="stat-value text-lg">$${f.current_value.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div>
      </div>
      <div class="stat">
        <div class="stat-title">還差</div>
        <div class="stat-value text-lg">$${f.remaining_amount.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div>
      </div>
      <div class="stat">
        <div class="stat-title">目前實際年化報酬率 (XIRR)</div>
        <div class="stat-value text-lg">${f.current_annual_return == null ? '-' : fmtPct(f.current_annual_return)}</div>
      </div>${etaStat}
    </div>`;
}

document.getElementById('fire-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = new FormData(e.target);
  if (!body.get('swr')) body.set('swr', '0.04');
  const res = await fetch('/api/fire', { method: 'POST', body });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  loadFire();
});

async function deleteFire() {
  await fetch('/api/fire/delete', { method: 'POST' });
  document.getElementById('fire-form').reset();
  loadFire();
}

loadFire();
</script>
