  <h2 id="section-dca" class="flex items-center gap-2 text-lg font-bold mb-3">
    <span class="w-1.5 h-5 bg-primary rounded-full"></span>DCA 定期定額 vs 一次投入
  </h2>
  <div class="card bg-base-100 shadow-sm mb-8">
    <div class="card-body">
      <p class="text-xs opacity-60">
        用上面「目標配置」的權重模擬：定期定額（每期投入固定金額買進）vs 一次投入（把該方案累積投入的總金額，在第一天全部投入）。<b>不同投入方案的「一次投入」基準金額不同</b>，因為每期投入金額跟頻率不同，累積的總投入金額也不同（見下方「投入總額」）。「比較標的」可以填一個或多個標的，用分號分隔多條線，例如 <code>QQQ; VOO:0.6,QQQ:0.4</code>。「比較投入方案」可以填一個或多個「金額/頻率」，用分號分隔，例如 <code>1000/M; 10000/A</code> 同時比較每月投入 1000 跟每年投入 10000。不含手續費/稅金，僅供參考，不是投資建議。
      </p>
      <div class="bg-base-200 rounded-box p-4 mt-2">
        <form id="dca-form" class="flex flex-wrap gap-2 items-end">
          <label class="text-sm">開始<br>
            <input name="start" type="date" required class="input input-bordered input-sm mt-1 w-36">
          </label>
          <label class="text-sm">結束<br>
            <input name="end" type="date" required class="input input-bordered input-sm mt-1 w-36">
          </label>
          <label class="text-sm">每期投入金額<br>
            <input name="contribution" type="number" min="1" step="any" placeholder="1000" required class="input input-bordered input-sm mt-1 w-24">
          </label>
          <label class="text-sm">投入頻率<br>
            <select name="frequency" class="select select-bordered select-sm mt-1">
              <option value="M" selected>每月</option>
              <option value="Q">每季</option>
              <option value="H">每半年</option>
              <option value="A">每年</option>
            </select>
          </label>
          <label class="text-sm">比較標的<br>
            <div class="relative">
              <input id="dca-compare" name="compare" placeholder="QQQ; VOO:0.6,QQQ:0.4" autocomplete="off"
                class="input input-bordered input-sm mt-1 w-40">
              <ul id="dca-compare-suggestions" class="absolute z-20 hidden menu bg-base-100 rounded-box shadow-md mt-1 w-56 max-h-56 overflow-y-auto flex-nowrap"></ul>
            </div>
          </label>
          <label class="text-sm">比較投入方案<br>
            <input name="plans" placeholder="1000/M; 10000/A" class="input input-bordered input-sm mt-1 w-32">
          </label>
          <button type="submit" class="btn btn-neutral btn-sm">查詢</button>
        </form>
      </div>
      <div id="dca-error" class="alert alert-error text-sm mt-3 hidden"></div>
      <div id="dca-stats" class="stats shadow mt-3 hidden [grid-template-columns:repeat(3,1fr)] [grid-auto-flow:row] [&_.stat-title]:whitespace-normal [&_.stat-value]:whitespace-normal"></div>
      <div class="h-64 mt-4"><canvas id="dcaChart"></canvas></div>
    </div>
  </div>

<script>
attachTickerAutocomplete('dca-compare', 'dca-compare-suggestions', { multi: true });
// --- DCA 定期定額 vs 一次投入 ---
let dcaChart = null;
document.getElementById('dca-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('dca-error');
  errorBox.classList.add('hidden');
  const body = new FormData(e.target);
  const res = await fetch('/api/dca', { method: 'POST', body });
  const data = await res.json();
  if (data.error) {
    errorBox.textContent = data.error;
    errorBox.classList.remove('hidden');
    document.getElementById('dca-stats').classList.add('hidden');
    return;
  }

  const retClass = v => v >= 0 ? 'text-success' : 'text-error';
  const statsBox = document.getElementById('dca-stats');
  statsBox.classList.remove('hidden');
  statsBox.innerHTML = data.items.map(item => `
    <div class="stat"><div class="stat-title">${escapeHtml(item.label)} - 投入總額</div><div class="stat-value text-lg">${item.total_invested.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div></div>
    <div class="stat"><div class="stat-title">${escapeHtml(item.label)} - DCA</div><div class="stat-value text-lg">${item.dca_final_value.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div><div class="stat-desc ${retClass(item.dca_return)}">${fmtPct(item.dca_return)}</div></div>
    <div class="stat"><div class="stat-title">${escapeHtml(item.label)} - 一次投入</div><div class="stat-value text-lg">${item.lumpsum_final_value.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div><div class="stat-desc ${retClass(item.lumpsum_return)}">${fmtPct(item.lumpsum_return)}</div></div>
  `).join('');

  // Different baskets can have different available price history (e.g. a
  // recently-IPO'd holding) -- union all dates for the shared axis and
  // left-pad each series with null so it lands on the correct date instead
  // of silently shifting.
  const unionDates = [...new Set(data.items.flatMap(item => item.dates))].sort();
  const alignToUnion = (item, values) => {
    const byDate = Object.fromEntries(item.dates.map((d, i) => [d, values[i]]));
    return unionDates.map(d => byDate[d] ?? null);
  };

  const dcaColors = ['#4f46e5', '#0ea5e9', '#a855f7', '#14b8a6'];
  const lumpsumColors = ['#f59e0b', '#ef4444', '#84cc16', '#ec4899'];
  const datasets = data.items.flatMap((item, i) => [
    {
      label: `${item.label} - DCA`, data: alignToUnion(item, item.dca_value),
      borderWidth: 1.5, pointRadius: 0, borderColor: dcaColors[i % dcaColors.length],
    },
    {
      label: `${item.label} - 一次投入`, data: alignToUnion(item, item.lumpsum_value),
      borderWidth: 1.5, pointRadius: 0, borderDash: [4, 4], borderColor: lumpsumColors[i % lumpsumColors.length],
    },
  ]);

  if (dcaChart) dcaChart.destroy();
  dcaChart = new Chart(document.getElementById('dcaChart'), {
    type: 'line',
    data: { labels: unionDates, datasets },
    options: {
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      spanGaps: true,
      scales: { x: { ticks: { maxTicksLimit: 10 } } },
      plugins: {
        tooltip: {
          callbacks: {
            label: (ctx) => ctx.parsed.y == null ? undefined : ` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString('en-US', { maximumFractionDigits: 0 })}`,
          },
        },
      },
    },
  });
});
</script>
