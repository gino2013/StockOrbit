  <h2 id="section-goal" class="flex items-center gap-2 text-lg font-bold mb-3">
    <span class="w-1.5 h-5 bg-primary rounded-full"></span>目標達成進度追蹤
  </h2>
  <div class="card bg-base-100 shadow-sm mb-8">
    <div class="card-body">
      <p class="text-xs opacity-60">設定一個長期目標金額跟日期，追蹤目前進度、跟達標所需的年化報酬率。</p>
      <form id="goal-form" class="flex flex-wrap gap-3 items-end mt-2">
        <label class="text-sm">目標金額<br>
          <input name="target_amount" type="number" min="1" step="any" placeholder="1000000" required class="input input-bordered input-sm mt-1 w-40">
        </label>
        <label class="text-sm">目標日期<br>
          <input name="target_date" type="date" required class="input input-bordered input-sm mt-1 w-40">
        </label>
        <button type="submit" class="btn btn-neutral btn-sm">設定目標</button>
        <button type="button" onclick="deleteGoal()" id="goal-delete-btn" class="btn btn-ghost btn-sm hidden">清除目標</button>
      </form>
      <div id="goal-content" class="mt-3"></div>
    </div>
  </div>

<script>
let goalProjectionChart = null;
async function loadGoal() {
  const content = document.getElementById('goal-content');
  const deleteBtn = document.getElementById('goal-delete-btn');
  const res = await fetch('/api/goal');
  const data = await res.json();
  if (!data.goal) {
    content.innerHTML = '';
    deleteBtn.classList.add('hidden');
    return;
  }
  const g = data.goal;
  deleteBtn.classList.remove('hidden');
  document.querySelector('#goal-form input[name=target_amount]').value = g.target_amount;
  document.querySelector('#goal-form input[name=target_date]').value = g.target_date;

  const progressPct = (g.progress_pct * 100).toFixed(1);
  const onTrackBadge = g.on_track === null ? ''
    : g.on_track ? '<span class="badge badge-success badge-sm ml-2">進度超前所需報酬率</span>'
    : '<span class="badge badge-warning badge-sm ml-2">目前報酬率低於所需</span>';

  // "at the current pace" projected hit date: a real date if the current
  // XIRR gets there, otherwise a clear "won't reach it" line.
  let projectedStat = '';
  if (g.projection && g.projection.length) {
    if (g.projected_achievement_date && g.projected_achievement_date !== g.projection[0].date) {
      const early = g.projected_achievement_date < g.target_date;
      projectedStat = `
      <div class="stat">
        <div class="stat-title">以目前 XIRR 推估達標</div>
        <div class="stat-value text-lg ${early ? 'text-success' : 'text-warning'}">${g.projected_achievement_date}</div>
        <div class="stat-desc">${early ? '早於' : '晚於'}目標日期</div>
      </div>`;
    } else if (!g.projected_achievement_date) {
      projectedStat = `
      <div class="stat">
        <div class="stat-title">以目前 XIRR 推估達標</div>
        <div class="stat-value text-lg text-error">達不到</div>
        <div class="stat-desc">目前報酬率下市值不會成長到目標</div>
      </div>`;
    }
  }

  let html = `
    <div class="flex justify-between text-sm mb-1">
      <span>${g.target_date} 前達到 $${g.target_amount.toLocaleString('en-US', { maximumFractionDigits: 0 })}</span>
      <span>${progressPct}%</span>
    </div>
    <progress class="progress progress-primary w-full" value="${progressPct}" max="100"></progress>`;
  if (g.projection && g.projection.length) {
    html += '<div class="h-64 mt-4"><canvas id="goalProjectionChart"></canvas></div>';
  }
  html += `
    <div class="stats stats-vertical sm:stats-horizontal shadow bg-base-200 mt-3">
      <div class="stat">
        <div class="stat-title">目前市值</div>
        <div class="stat-value text-lg">$${g.current_value.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div>
      </div>
      <div class="stat">
        <div class="stat-title">還差</div>
        <div class="stat-value text-lg">$${g.remaining_amount.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div>
      </div>
      <div class="stat">
        <div class="stat-title">需要的年化報酬率</div>
        <div class="stat-value text-lg">${g.required_annual_return == null ? '-' : fmtPct(g.required_annual_return)}</div>
      </div>
      <div class="stat">
        <div class="stat-title">目前實際年化報酬率 (XIRR)</div>
        <div class="stat-value text-lg">${g.current_annual_return == null ? '-' : fmtPct(g.current_annual_return)}${onTrackBadge}</div>
      </div>${projectedStat}
    </div>`;
  if (g.already_past_target_date) {
    html += '<div class="alert alert-warning text-sm py-2 mt-2">目標日期已過，考慮更新目標。</div>';
  }
  content.innerHTML = html;

  if (goalProjectionChart) { goalProjectionChart.destroy(); goalProjectionChart = null; }
  if (g.projection && g.projection.length) {
    const labels = g.projection.map(p => p.date.slice(0, 7));
    goalProjectionChart = new Chart(document.getElementById('goalProjectionChart'), {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: '以目前 XIRR 推估市值', data: g.projection.map(p => p.value),
            borderColor: '#4f46e5', borderWidth: 2, pointRadius: 0, tension: 0.15 },
          { label: `目標 $${g.target_amount.toLocaleString('en-US', { maximumFractionDigits: 0 })}`,
            data: labels.map(() => g.target_amount),
            borderColor: '#10b981', borderWidth: 1.5, pointRadius: 0, borderDash: [5, 4] },
        ],
      },
      options: {
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 }, padding: 8 } },
          tooltip: { callbacks: { label: (ctx) => ` ${ctx.dataset.label}: $${ctx.parsed.y.toLocaleString('en-US', { maximumFractionDigits: 0 })}` } },
        },
        scales: {
          x: { ticks: { maxTicksLimit: 10 } },
          y: { ticks: { callback: (v) => '$' + v.toLocaleString() } },
        },
      },
    });
  }
}

document.getElementById('goal-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  await fetch('/api/goal', { method: 'POST', body: new FormData(e.target) });
  loadGoal();
});

async function deleteGoal() {
  await fetch('/api/goal/delete', { method: 'POST' });
  document.getElementById('goal-form').reset();
  loadGoal();
}

loadGoal();
</script>
