  <h2 id="section-performance-report" class="flex items-center gap-2 text-lg font-bold mb-3">
    <span class="w-1.5 h-5 bg-primary rounded-full"></span>月度/年度績效報告
  </h2>
  <div class="card bg-base-100 shadow-sm mb-8">
    <div class="card-body">
      <p class="text-xs opacity-60">整理某段期間的持股報酬、跟比較基準的比較，跟這段期間的交易紀錄，適合搭配「匯出 PDF」列印成一份報告。三個報酬數字看的是不同東西：<b>組合價格報酬</b>用目前股數回推期間市值（近似值，未計期間內加減碼時點）；<b>資金加權報酬 (XIRR)</b> 用交易紀錄還原起始日持股，再把期間內每筆買賣按實際日期計入，年化；<b>自買入以來總報酬</b>是相對你實際成本、不分期間（等同上方「報酬率」卡片）。</p>
      <div class="flex flex-wrap items-end gap-2 mt-2">
        <div class="join">
          <button type="button" onclick="loadPerformanceReportPreset('month')" class="btn btn-sm join-item">本月</button>
          <button type="button" onclick="loadPerformanceReportPreset('year')" class="btn btn-sm join-item">本年</button>
        </div>
        <div>
          <label class="text-xs opacity-60 block mb-1">開始</label>
          <input id="performance-report-start" type="date" class="input input-bordered input-sm w-36">
        </div>
        <div>
          <label class="text-xs opacity-60 block mb-1">結束</label>
          <input id="performance-report-end" type="date" class="input input-bordered input-sm w-36">
        </div>
        <div>
          <label class="text-xs opacity-60 block mb-1">比較基準</label>
          <input id="performance-report-benchmark" placeholder="SPY" value="SPY" class="input input-bordered input-sm w-24">
        </div>
        <button type="button" onclick="loadPerformanceReport()" class="btn btn-neutral btn-sm">查詢</button>
      </div>
      <div id="performance-report-error" class="alert alert-error text-sm hidden mt-2"></div>
      <div id="performance-report-content" class="mt-3"></div>
    </div>
  </div>

<script>
function toggleTransactionNoteEdit(btn) {
  const cell = btn.closest('td');
  cell.querySelector('.tx-note-view').style.display = 'none';
  const editRow = cell.querySelector('.tx-note-edit');
  editRow.style.display = 'flex';
  editRow.querySelector('input').focus();
}
async function saveTransactionNote(btn) {
  const input = btn.previousElementSibling;
  const cell = btn.closest('td');
  btn.disabled = true;
  const body = new FormData();
  body.set('transaction_id', input.dataset.txId);
  body.set('note', input.value);
  await fetch('/api/transaction-notes', { method: 'POST', body });
  btn.disabled = false;
  const view = cell.querySelector('.tx-note-view');
  const span = view.querySelector('span');
  span.textContent = input.value || '尚無筆記';
  span.classList.toggle('opacity-40', !input.value);
  cell.querySelector('.tx-note-edit').style.display = 'none';
  view.style.display = 'flex';
}
// --- 月度/年度績效報告 ---
function loadPerformanceReportPreset(period) {
  const now = new Date();
  let start;
  if (period === 'month') {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
  } else {
    start = new Date(now.getFullYear(), 0, 1);
  }
  document.getElementById('performance-report-start').value = start.toISOString().slice(0, 10);
  document.getElementById('performance-report-end').value = now.toISOString().slice(0, 10);
  loadPerformanceReport();
}

async function loadPerformanceReport() {
  const start = document.getElementById('performance-report-start').value;
  const end = document.getElementById('performance-report-end').value;
  const benchmark = document.getElementById('performance-report-benchmark').value || 'SPY';
  const errorBox = document.getElementById('performance-report-error');
  const content = document.getElementById('performance-report-content');
  errorBox.classList.add('hidden');
  if (!start || !end) return;
  content.innerHTML = '<p class="opacity-60">查詢中…</p>';

  const body = new FormData();
  body.set('start', start);
  body.set('end', end);
  body.set('benchmark', benchmark);
  const res = await fetch('/api/performance-report', { method: 'POST', body });
  const data = await res.json();
  if (data.error) {
    content.innerHTML = '';
    errorBox.textContent = data.error;
    errorBox.classList.remove('hidden');
    return;
  }

  const retClass = v => v >= 0 ? 'text-success' : 'text-error';
  const pctOrDash = v => (v === null || v === undefined) ? '—' : fmtPct(v);
  const nullRetClass = v => (v === null || v === undefined) ? '' : retClass(v);
  let html = `<div class="stats stats-vertical sm:stats-horizontal shadow bg-base-200">
    <div class="stat">
      <div class="stat-title">${data.start} ~ ${data.end} 組合價格報酬</div>
      <div class="stat-value text-lg ${retClass(data.period_return)}">${fmtPct(data.period_return)}</div>
      <div class="stat-desc">用目前股數回推，未計進出場時點</div>
    </div>
    <div class="stat">
      <div class="stat-title">${escapeHtml(benchmark)} 同期報酬</div>
      <div class="stat-value text-lg ${retClass(data.benchmark_return)}">${fmtPct(data.benchmark_return)}</div>
    </div>
    <div class="stat">
      <div class="stat-title">本期資金加權報酬（XIRR）</div>
      <div class="stat-value text-lg ${nullRetClass(data.period_xirr)}">${pctOrDash(data.period_xirr)}</div>
      <div class="stat-desc">年化，計入實際買賣時點${data.period_pnl === null || data.period_pnl === undefined ? '' : `・期間損益 $${data.period_pnl.toLocaleString('en-US', { maximumFractionDigits: 0 })}`}</div>
    </div>
    <div class="stat">
      <div class="stat-title">自買入以來總報酬</div>
      <div class="stat-value text-lg ${nullRetClass(data.since_purchase_return)}">${pctOrDash(data.since_purchase_return)}</div>
      <div class="stat-desc">相對實際成本，不分期間</div>
    </div>
    <div class="stat">
      <div class="stat-title">期間已實現損益</div>
      <div class="stat-value text-lg ${retClass(data.realized_gain)}">$${data.realized_gain.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div>
      <div class="stat-desc">${data.realized_trade_count} 筆交易</div>
    </div>
  </div>`;

  html += '<p class="font-medium text-sm mt-4 mb-1">期間交易紀錄</p>';
  html += '<p class="text-xs opacity-50 mb-1">「筆記」可以記錄當下買賣的理由或想法，之後回顧損益時能看到當初怎麼想的。純記錄工具，不做任何分析或建議。</p>';
  if (!data.transactions.length) {
    html += '<p class="text-sm opacity-50">這段期間沒有交易紀錄。</p>';
  } else {
    html += '<table class="table table-sm"><thead><tr><th>日期</th><th>類型</th><th>代號</th><th class="text-right">股數</th><th class="text-right">金額</th><th>筆記</th></tr></thead><tbody>';
    for (const t of data.transactions) {
      html += `<tr>
        <td>${t.report_date}</td>
        <td>${escapeHtml(t.trans_type)}</td>
        <td>${escapeHtml(t.symbol || '')}</td>
        <td class="text-right">${t.quantity || ''}</td>
        <td class="text-right ${retClass(t.amount)}">${t.amount.toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>
        <td>
          <div class="tx-note-view flex items-center gap-1">
            <span class="text-xs ${t.note ? '' : 'opacity-40'}">${t.note ? escapeHtml(t.note) : '尚無筆記'}</span>
            <button type="button" class="btn btn-ghost btn-xs" onclick="toggleTransactionNoteEdit(this)">編輯</button>
          </div>
          <div class="tx-note-edit flex items-center gap-1" style="display:none">
            <input type="text" class="input input-bordered input-xs w-40" data-tx-id="${escapeHtml(t.id)}" value="${escapeHtml(t.note || '')}" placeholder="當下的理由...">
            <button type="button" class="btn btn-ghost btn-xs" onclick="saveTransactionNote(this)">儲存</button>
          </div>
        </td>
      </tr>`;
    }
    html += '</tbody></table>';
  }
  content.innerHTML = html;
  const table = content.querySelector('table');
  if (table) makeSortable(table);
}
</script>
