  <h2 id="section-attribution" class="flex items-center gap-2 text-lg font-bold mb-3">
    <span class="w-1.5 h-5 bg-primary rounded-full"></span>績效歸因（配置效果）
  </h2>
  <div class="card bg-base-100 shadow-sm mb-8">
    <div class="card-body">
      <p class="text-xs opacity-60">
        拆解「目前持股 vs 你自己設定的目標配置」在這段期間的報酬差異，有多少是因為某檔標的目前佔比偏離目標（超配/低配）。基準是你自己的目標配置，不是大盤——跟大盤比沒有「配置」這個維度可比。因為比較的兩邊是同一批標的，只有權重不同，選股效果／交互效果在數學上恆為 0（沒有「不同的標的選擇」可比），全部差異都會落在配置效果上；正值代表偏離目標的配置目前是加分的，負值代表扣分。純資訊呈現，不建議你該不該調整。
      </p>
      <div class="flex flex-wrap items-end gap-2 mt-2">
        <div class="join">
          <button type="button" onclick="loadAttributionPreset('month')" class="btn btn-sm join-item">本月</button>
          <button type="button" onclick="loadAttributionPreset('year')" class="btn btn-sm join-item">本年</button>
        </div>
        <div>
          <label class="text-xs opacity-60 block mb-1">開始</label>
          <input id="attribution-start" type="date" class="input input-bordered input-sm w-36">
        </div>
        <div>
          <label class="text-xs opacity-60 block mb-1">結束</label>
          <input id="attribution-end" type="date" class="input input-bordered input-sm w-36">
        </div>
        <button type="button" onclick="loadAttribution()" class="btn btn-neutral btn-sm">查詢</button>
      </div>
      <div id="attribution-error" class="alert alert-error text-sm hidden mt-2"></div>
      <div id="attribution-content" class="mt-3"></div>
    </div>
  </div>

<script>
// --- 績效歸因（配置效果） ---
function loadAttributionPreset(period) {
  const now = new Date();
  const start = period === 'month'
    ? new Date(now.getFullYear(), now.getMonth(), 1)
    : new Date(now.getFullYear(), 0, 1);
  document.getElementById('attribution-start').value = start.toISOString().slice(0, 10);
  document.getElementById('attribution-end').value = now.toISOString().slice(0, 10);
  loadAttribution();
}

async function loadAttribution() {
  const start = document.getElementById('attribution-start').value;
  const end = document.getElementById('attribution-end').value;
  const errorBox = document.getElementById('attribution-error');
  const content = document.getElementById('attribution-content');
  errorBox.classList.add('hidden');
  if (!start || !end) return;
  content.innerHTML = '<p class="opacity-60">查詢中…</p>';

  const body = new FormData();
  body.set('start', start);
  body.set('end', end);
  const res = await fetch('/api/attribution', { method: 'POST', body: withAccount(body) });
  const data = await res.json();
  if (data.error) {
    content.innerHTML = '';
    errorBox.textContent = data.error;
    errorBox.classList.remove('hidden');
    return;
  }

  let html = '<div class="stats stats-vertical sm:stats-horizontal shadow w-full bg-base-200 mb-3">' +
    `<div class="stat"><div class="stat-title">配置效果</div><div class="stat-value text-lg ${posNegClass(data.allocation_effect)}">${fmtPct(data.allocation_effect)}</div></div>` +
    `<div class="stat"><div class="stat-title">選股效果</div><div class="stat-value text-lg">${fmtPct(data.selection_effect)}</div><div class="stat-desc">恆為 0，見上方說明</div></div>` +
    `<div class="stat"><div class="stat-title">交互效果</div><div class="stat-value text-lg">${fmtPct(data.interaction_effect)}</div></div>` +
    `<div class="stat"><div class="stat-title">總差異</div><div class="stat-value text-lg ${posNegClass(data.total_effect)}">${fmtPct(data.total_effect)}</div></div>` +
    '</div>';

  html += '<table class="table table-sm"><thead><tr><th>代號</th><th class="text-right">目前佔比</th><th class="text-right">目標佔比</th><th class="text-right">期間報酬</th><th class="text-right">配置貢獻</th></tr></thead><tbody>';
  for (const i of data.items) {
    html += `<tr>
      <td class="font-medium">${escapeHtml(i.symbol)}</td>
      <td class="text-right">${fmtPctOrDash(i.current_weight)}</td>
      <td class="text-right">${fmtPctOrDash(i.target_weight)}</td>
      <td class="text-right ${posNegClass(i.return)}">${fmtPct(i.return)}</td>
      <td class="text-right ${posNegClass(i.allocation_contribution)}">${fmtPct(i.allocation_contribution)}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  content.innerHTML = html;
  makeSortable(content.querySelector('table'));
}
</script>
