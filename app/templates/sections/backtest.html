  <h2 id="section-backtest" class="flex items-center gap-2 text-lg font-bold mb-3">
    <span class="w-1.5 h-5 bg-primary rounded-full"></span>再平衡策略回測
  </h2>
  <div class="card bg-base-100 shadow-sm">
    <div class="card-body">
      <p class="text-xs opacity-60">
        用上面「目標配置」的權重模擬過去表現。「比較基準」預設 SPY，也可以填一個或多個比較標的，用分號分隔多條線，例如 <code>SPY; QQQ:0.6,VOO:0.4</code>。不含手續費/稅金，僅供參考。
      </p>
      <div class="bg-base-200 rounded-box p-4 mt-2">
        <form id="backtest-form" class="flex flex-wrap gap-3 items-end">
          <label class="text-sm">開始<br>
            <input name="start" type="date" required class="input input-bordered input-sm mt-1 w-40">
          </label>
          <label class="text-sm">結束<br>
            <input name="end" type="date" required class="input input-bordered input-sm mt-1 w-40">
          </label>
          <label class="text-sm">再平衡頻率<br>
            <select name="rebalance" class="select select-bordered select-sm mt-1">
              <option value="none">不再平衡</option>
              <option value="M" selected>每月</option>
              <option value="Q">每季</option>
              <option value="A">每年</option>
            </select>
          </label>
          <label class="text-sm">比較基準<br>
            <div class="relative">
              <input id="backtest-benchmark" name="benchmark" placeholder="SPY; QQQ:0.6,VOO:0.4" value="SPY" autocomplete="off"
                class="input input-bordered input-sm mt-1 w-56">
              <ul id="backtest-benchmark-suggestions" class="absolute z-20 hidden menu bg-base-100 rounded-box shadow-md mt-1 w-56 max-h-56 overflow-y-auto flex-nowrap"></ul>
            </div>
          </label>
          <button type="submit" class="btn btn-neutral">執行回測</button>
          <label class="label cursor-pointer gap-2 text-sm ml-auto self-end pb-2">
            <input type="checkbox" name="exclude_portfolio" value="true" class="checkbox checkbox-sm">
            移除我的持股組合
          </label>
        </form>
      </div>
      <p id="backtest-exclude-hint" class="text-xs opacity-50 mt-2 hidden">已移除你的投資組合。這樣比較基準就不會被你目標配置裡某檔較晚上市的標的限制住最早的起始日期。</p>
      <div id="backtest-error" class="alert alert-error text-sm mt-3 hidden"></div>

      <div id="backtest-stats" class="stats shadow mt-3 hidden [grid-template-columns:repeat(auto-fit,minmax(180px,1fr))] [grid-auto-flow:row] [&_.stat-title]:whitespace-normal [&_.stat-value]:whitespace-normal"></div>
      <div id="backtest-analysis" class="text-sm opacity-80 mt-3"></div>

      <div class="h-64 mt-4"><canvas id="backtestChart"></canvas></div>
      <div id="backtest-legend" class="flex flex-wrap gap-4 mt-3 text-xs opacity-60 hidden">
        <span class="flex items-center gap-1.5"><span class="inline-block w-3 border-t-2 border-dashed border-primary"></span>再平衡日</span>
        <span class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 bg-error/20 border border-error/40"></span>最大回撤區間</span>
        <span class="flex items-center gap-1.5"><span class="inline-block w-3 border-t-2 border-success/60"></span>重大波動日（大漲）</span>
        <span class="flex items-center gap-1.5"><span class="inline-block w-3 border-t-2 border-error/60"></span>重大波動日（大跌）</span>
      </div>
      <div id="backtest-moves" class="text-xs mt-3"></div>
    </div>
  </div>

<script>
attachTickerAutocomplete('backtest-benchmark', 'backtest-benchmark-suggestions', { multi: true });
// --- 再平衡策略回測 ---
let backtestChart = null;
document.getElementById('backtest-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('backtest-error');
  errorBox.classList.add('hidden');
  const body = new FormData(e.target);
  const res = await fetch('/api/backtest', { method: 'POST', body });
  const data = await res.json();
  if (data.error) {
    errorBox.textContent = data.error;
    errorBox.classList.remove('hidden');
    document.getElementById('backtest-stats').classList.add('hidden');
    document.getElementById('backtest-legend').classList.add('hidden');
    return;
  }

  document.getElementById('backtest-exclude-hint').classList.toggle('hidden', !data.portfolio_excluded);

  const statsBox = document.getElementById('backtest-stats');
  const analysisBox = document.getElementById('backtest-analysis');
  statsBox.classList.remove('hidden');
  document.getElementById('backtest-legend').classList.toggle('hidden', !!data.portfolio_excluded);

  const retClass = v => v >= 0 ? 'text-success' : 'text-error';
  const ddNum = v => `<b class="text-error">${fmtPct(v)}</b>`;
  const volNum = v => `<b class="text-warning">${(v * 100).toFixed(1)}%</b>`;
  let statsHtml = '';
  let analysisHtml = '';

  if (data.portfolio_excluded) {
    (data.benchmarks || []).forEach((b) => {
      statsHtml += `<div class="stat"><div class="stat-title">${escapeHtml(b.label)}</div><div class="stat-value text-lg ${retClass(b.return)}">${fmtPct(b.return)}</div></div>`;
      analysisHtml += `<p>${escapeHtml(b.label)} 最大回撤：${ddNum(b.max_drawdown)}`;
      if (b.volatility != null) analysisHtml += `，年化波動度：${volNum(b.volatility)}`;
      analysisHtml += `。</p>`;
    });
  } else {
    statsHtml =
      `<div class="stat"><div class="stat-title">總報酬</div><div class="stat-value text-lg ${retClass(data.total_return)}">${fmtPct(data.total_return)}</div></div>` +
      `<div class="stat"><div class="stat-title">最大回撤</div><div class="stat-value text-lg text-error">${fmtPct(data.max_drawdown)}</div></div>`;
    (data.benchmarks || []).forEach((b) => {
      statsHtml += `<div class="stat"><div class="stat-title">${escapeHtml(b.label)}</div><div class="stat-value text-lg ${retClass(b.return)}">${fmtPct(b.return)}</div></div>`;
      const ddCompare = data.max_drawdown <= b.max_drawdown ? '較深' : '較淺';
      analysisHtml += `<p>最大回撤：投資組合 ${ddNum(data.max_drawdown)} vs ${escapeHtml(b.label)} ${ddNum(b.max_drawdown)}（投資組合下跌${ddCompare}）。</p>`;
      if (data.volatility != null && b.volatility != null) {
        const volCompare = data.volatility <= b.volatility ? '較低' : '較高';
        analysisHtml += `<p>年化波動度：投資組合 ${volNum(data.volatility)} vs ${escapeHtml(b.label)} ${volNum(b.volatility)}（${volCompare}）。</p>`;
      }
    });
  }
  statsBox.innerHTML = statsHtml;
  analysisBox.innerHTML = analysisHtml;

  // Only draw individual rebalance-day lines when there aren't too many to read.
  const annotations = {};
  if (data.rebalance_dates && data.rebalance_dates.length <= 30) {
    data.rebalance_dates.forEach((d, i) => {
      annotations[`reb${i}`] = {
        type: 'line', xMin: d, xMax: d, borderColor: '#c7d2fe', borderWidth: 1, borderDash: [4, 4],
      };
    });
  }
  if (data.drawdown_peak_date && data.drawdown_trough_date) {
    annotations['drawdown'] = {
      type: 'box', xMin: data.drawdown_peak_date, xMax: data.drawdown_trough_date,
      backgroundColor: 'rgba(244, 63, 94, 0.08)', borderWidth: 0,
    };
  }

  const movesBox = document.getElementById('backtest-moves');
  const backtestMovesByDate = {};
  if (data.notable_moves && data.notable_moves.length) {
    data.notable_moves.forEach((m, i) => {
      backtestMovesByDate[m.date] = m.change;
      annotations[`move${i}`] = {
        type: 'line', xMin: m.date, xMax: m.date,
        borderColor: m.change >= 0 ? 'rgba(16,185,129,0.5)' : 'rgba(244,63,94,0.5)', borderWidth: 1.5,
      };
    });
    const items = data.notable_moves
      .map(m => `<li>• ${m.date}：${m.change >= 0 ? '大漲' : '大跌'} ${Math.abs(m.change * 100).toFixed(1)}%</li>`)
      .join('');
    movesBox.innerHTML =
      `<p class="font-medium mb-1">重大波動日（單日 ±3% 以上）</p><ul class="space-y-0.5 opacity-80">${items}</ul>` +
      `<p class="opacity-50 mt-1">只標出「哪幾天波動大」，無法自動回溯當天的新聞原因（新聞來源只保留最新報導）。想知道原因可以自己查那天的日期。</p>`;
  } else {
    movesBox.innerHTML = '';
  }

  const backtestDatasets = data.portfolio_excluded
    ? []
    : [{ label: '投資組合', data: data.portfolio_value, borderWidth: 1.5, pointRadius: 0, borderColor: '#4f46e5' }];
  (data.benchmarks || []).forEach((b, i) => {
    backtestDatasets.push({
      label: b.label, data: b.value, borderWidth: 1.5, pointRadius: 0,
      borderColor: compareColors[i % compareColors.length],
    });
  });
  if (data.no_rebalance_value) {
    backtestDatasets.push({
      label: '投資組合（不再平衡）', data: data.no_rebalance_value, borderWidth: 1.5, pointRadius: 0,
      borderColor: '#a78bfa', borderDash: [3, 3],
    });
  }

  if (backtestChart) backtestChart.destroy();
  backtestChart = new Chart(document.getElementById('backtestChart'), {
    type: 'line',
    data: {
      labels: data.dates,
      datasets: backtestDatasets,
    },
    options: {
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: { x: { ticks: { maxTicksLimit: 10 } } },
      plugins: {
        annotation: { annotations },
        tooltip: {
          callbacks: {
            afterLabel: (ctx) => {
              const change = backtestMovesByDate[ctx.label];
              if (change === undefined) return '';
              return `重大波動：${change >= 0 ? '大漲' : '大跌'} ${Math.abs(change * 100).toFixed(1)}%`;
            },
          },
        },
      },
    },
  });
});
{% if targets %}
// Deferred to DOMContentLoaded - see the matching comment in history.html.
document.addEventListener('DOMContentLoaded', () => document.getElementById('backtest-form').requestSubmit());
{% endif %}
</script>
