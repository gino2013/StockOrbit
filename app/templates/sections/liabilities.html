  <h2 id="section-liabilities" class="flex items-center gap-2 text-lg font-bold mb-3">
    <span class="w-1.5 h-5 bg-primary rounded-full"></span>負債（信貸）
  </h2>
  <div class="card bg-base-100 shadow-sm mb-8">
    <div class="card-body">
      <p class="text-xs opacity-60">
        記錄用來投入投資的信貸（本金／年利率／月付款／起貸日），未償還餘額用標準攤還公式自動算，不用每月手動更新。填好之後，頁首會多一張「淨資產」卡片（總市值 － 所有未償還負債），下面也會多一組「加權平均信貸利率 vs 目前投組 XIRR」的利差比較，借錢投資到底划不划算，一個數字看完。純記錄工具，不是貸款建議。
      </p>
      <div class="flex flex-wrap items-end gap-2 mt-2">
        <div>
          <label class="text-xs opacity-60 block mb-1">名稱</label>
          <input id="liability-name" placeholder="信貸-A銀行" class="input input-bordered input-sm w-32">
        </div>
        <div>
          <label class="text-xs opacity-60 block mb-1">本金</label>
          <input id="liability-principal" type="number" min="1" step="any" placeholder="500000" class="input input-bordered input-sm w-28">
        </div>
        <div>
          <label class="text-xs opacity-60 block mb-1">年利率 (%)</label>
          <input id="liability-rate" type="number" min="0" max="99" step="any" placeholder="3" class="input input-bordered input-sm w-20">
        </div>
        <div>
          <label class="text-xs opacity-60 block mb-1">月付款</label>
          <input id="liability-payment" type="number" min="1" step="any" placeholder="5000" class="input input-bordered input-sm w-24">
        </div>
        <div>
          <label class="text-xs opacity-60 block mb-1">幣別</label>
          <select id="liability-currency" class="select select-bordered select-sm w-24">
            <option value="TWD">TWD</option>
            <option value="USD">USD</option>
          </select>
        </div>
        <div>
          <label class="text-xs opacity-60 block mb-1">起貸日</label>
          <input id="liability-start" type="date" class="input input-bordered input-sm w-36">
        </div>
        <button type="button" onclick="addLiability()" class="btn btn-neutral btn-sm">新增</button>
      </div>
      <div id="liability-converted" class="text-xs opacity-50 mt-1 hidden"></div>
      <div id="liability-error" class="alert alert-error text-sm hidden mt-2"></div>
      <div id="leverage-spread-content"></div>
      <div id="liability-content" class="mt-3"></div>
    </div>
  </div>

<script>
// --- 負債（信貸） ---
function renderLiabilities(liabilities) {
  const content = document.getElementById('liability-content');
  if (!liabilities.length) {
    content.innerHTML = '<p class="text-xs opacity-60">還沒有記錄任何負債。</p>';
    return;
  }
  // 一律用新台幣呈現（issue #382）：台幣負債直接顯示，美金負債用最新參考匯率換算。
  const nt = (v, digits = 0) => v == null ? '-' : 'NT$' + v.toLocaleString('en-US', {maximumFractionDigits: digits});
  const term = (l) => l.term_months == null ? '<span class="opacity-50">月付款不夠付利息</span>'
    : `${l.term_months} 期（${(l.term_months / 12).toFixed(l.term_months % 12 ? 1 : 0)} 年）<span class="opacity-50">・剩 ${l.remaining_months} 期</span>`;
  let html = '<table class="table table-sm"><thead><tr><th>名稱</th><th class="text-right">本金</th><th class="text-right">年利率</th>' +
    '<th class="text-right">月付款</th><th>年期</th><th>起貸日</th><th class="text-right">未償還餘額</th><th></th></tr></thead><tbody>';
  for (const l of liabilities) {
    html += `<tr>
      <td class="font-medium">${escapeHtml(l.name)}</td>
      <td class="text-right opacity-70">${nt(l.principal_twd)}</td>
      <td class="text-right opacity-70">${(l.annual_rate * 100).toFixed(2)}%</td>
      <td class="text-right opacity-70">${nt(l.monthly_payment_twd)}</td>
      <td class="opacity-70 whitespace-nowrap">${term(l)}</td>
      <td class="opacity-70">${escapeHtml(l.start_date)}</td>
      <td class="text-right font-medium">${nt(l.remaining_balance_twd)}</td>
      <td class="text-right"><button type="button" onclick="deleteLiability('${escapeHtml(l.id)}')" class="btn btn-ghost btn-xs text-error">刪除</button></td>
    </tr>`;
  }
  html += '</tbody></table>';
  content.innerHTML = html;
}

// 「槓桿成本 vs 報酬比較」（issue #330）：加權平均信貸利率 vs 目前投組
// XIRR，利差 = XIRR － 加權平均利率。三個數字缺一個就不顯示這組卡片
// （例如還沒登記負債，或還沒有持股資料算不出 XIRR）。
function renderLeverageSpread(data) {
  const el = document.getElementById('leverage-spread-content');
  if (data.weighted_average_rate == null || data.leverage_spread == null) {
    el.innerHTML = '';
    return;
  }
  const spreadClass = posNegClass(data.leverage_spread);
  el.innerHTML = `
    <div class="stats stats-vertical sm:stats-horizontal shadow bg-base-200 w-full mt-2">
      <div class="stat">
        <div class="stat-title">加權平均信貸利率</div>
        <div class="stat-value text-lg">${fmtPctOrDash(data.weighted_average_rate)}</div>
        <div class="stat-desc">依未償還餘額加權</div>
      </div>
      <div class="stat">
        <div class="stat-title">目前投組 XIRR</div>
        <div class="stat-value text-lg">${fmtPctOrDash(data.portfolio_return)}</div>
      </div>
      <div class="stat">
        <div class="stat-title">利差</div>
        <div class="stat-value text-lg ${spreadClass}">${fmtPct(data.leverage_spread)}</div>
        <div class="stat-desc">${data.leverage_spread >= 0 ? '槓桿目前在賺' : '槓桿成本高於報酬'}，純資訊呈現</div>
      </div>
    </div>`;
}

function renderLiabilityContext(data) {
  renderLiabilities(data.liabilities || []);
  renderLeverageSpread(data);
}

async function loadLiabilities() {
  const res = await fetch('/api/liabilities');
  const data = await res.json();
  renderLiabilityContext(data);
}

// 參考匯率只用來在輸入時預覽換算結果；實際換算在後端，每次都用最新的
// USD/TWD 參考匯率（最近一次同步存的，跟頁首「總市值 (TWD)」同一個來源）。
const liabilityUsdTwdRate = {{ stats.usd_twd_rate | default(none) | tojson }};

async function addLiability() {
  const errorBox = document.getElementById('liability-error');
  const convertedBox = document.getElementById('liability-converted');
  errorBox.classList.add('hidden');
  convertedBox.classList.add('hidden');

  const name = document.getElementById('liability-name').value.trim();
  const enteredPrincipal = parseFloat(document.getElementById('liability-principal').value);
  const ratePct = document.getElementById('liability-rate').value;
  const enteredPayment = parseFloat(document.getElementById('liability-payment').value);
  const currency = document.getElementById('liability-currency').value;
  const startDate = document.getElementById('liability-start').value;
  if (!name || !enteredPrincipal || ratePct === '' || !enteredPayment || !startDate) {
    errorBox.textContent = '請填完整資訊';
    errorBox.classList.remove('hidden');
    return;
  }

  // 以輸入的幣別原樣存（台幣就存台幣），換算成美金由後端用最新匯率做。
  if (currency === 'TWD' && liabilityUsdTwdRate) {
    convertedBox.textContent = `≈ $${(enteredPrincipal / liabilityUsdTwdRate).toLocaleString('en-US', {maximumFractionDigits: 0})} USD 本金（參考匯率 ${liabilityUsdTwdRate.toFixed(4)}，匯率變動時會跟著更新）`;
    convertedBox.classList.remove('hidden');
  }

  const body = new FormData();
  body.set('name', name);
  body.set('principal', enteredPrincipal);
  body.set('annual_rate', ratePct / 100);
  body.set('monthly_payment', enteredPayment);
  body.set('currency', currency);
  body.set('start_date', startDate);
  const res = await fetch('/api/liabilities', { method: 'POST', body });
  const data = await res.json();
  if (data.error) {
    errorBox.textContent = data.error;
    errorBox.classList.remove('hidden');
    return;
  }
  document.getElementById('liability-name').value = '';
  document.getElementById('liability-principal').value = '';
  document.getElementById('liability-rate').value = '';
  document.getElementById('liability-payment').value = '';
  document.getElementById('liability-start').value = '';
  renderLiabilityContext(data);
}

async function deleteLiability(id) {
  const body = new FormData();
  body.set('liability_id', id);
  const res = await fetch('/api/liabilities/delete', { method: 'POST', body });
  const data = await res.json();
  renderLiabilityContext(data);
}

loadLiabilities();
</script>
