  <h2 id="section-tax-loss-harvesting" class="flex items-center gap-2 text-lg font-bold mb-3">
    <span class="w-1.5 h-5 bg-primary rounded-full"></span>稅務效率分析
  </h2>
  <div class="card bg-base-100 shadow-sm mb-8">
    <div class="card-body">
      <div class="flex items-center justify-between gap-2">
        <p class="text-xs opacity-60">找出目前有未實現虧損的部位，估算賣出這些部位可以抵銷多少今年已達起課的海外所得、大概能省多少稅。純規則式提示，不是投資建議，不建議賣出時機，wash sale 等規則不在範圍內，實際規則請以會計師意見為準。</p>
        <div class="flex items-center gap-2 shrink-0">
          <input id="tax-loss-year" type="number" class="input input-bordered input-xs w-20" placeholder="年份">
          <button type="button" onclick="loadTaxLossHarvesting()" class="btn btn-ghost btn-xs">查詢</button>
        </div>
      </div>
      <div id="tax-loss-error" class="alert alert-error text-sm hidden mt-2"></div>
      <div id="tax-loss-content" class="mt-2"></div>
    </div>
  </div>

<script>
async function loadTaxLossHarvesting() {
  const errorBox = document.getElementById('tax-loss-error');
  const content = document.getElementById('tax-loss-content');
  const yearInput = document.getElementById('tax-loss-year');
  errorBox.classList.add('hidden');
  content.innerHTML = '<p class="opacity-60">查詢中…</p>';

  const year = yearInput.value || new Date().getFullYear();
  const res = await fetch(`/api/tax-loss-harvesting?year=${encodeURIComponent(year)}`);
  const data = await res.json();
  if (data.error) {
    content.innerHTML = '';
    errorBox.textContent = data.error;
    errorBox.classList.remove('hidden');
    return;
  }

  if (!data.candidates.length) {
    content.innerHTML = '<p class="text-sm opacity-60">目前沒有未實現虧損的部位。</p>';
    return;
  }

  let html = `<div class="stats stats-vertical sm:stats-horizontal shadow bg-base-200 mb-3">
    <div class="stat">
      <div class="stat-title">未實現虧損總額</div>
      <div class="stat-value text-lg text-error">-$${data.total_unrealized_loss_usd.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div>
    </div>
    <div class="stat">
      <div class="stat-title">可抵銷金額（換算 NT$）</div>
      <div class="stat-value text-lg">NT$ ${data.offsettable_amount_twd.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div>
    </div>
    <div class="stat">
      <div class="stat-title">估計可省稅額（20% 稅率）</div>
      <div class="stat-value text-lg text-success">NT$ ${data.estimated_tax_savings_twd.toLocaleString('en-US', { maximumFractionDigits: 0 })}</div>
    </div>
  </div>`;

  if (data.taxable_excess_before_twd <= 0) {
    html += `<div class="alert alert-info text-sm py-2 mb-3">${data.year} 年的海外所得目前還沒超過基本所得額免稅額（NT$670萬），賣出虧損部位不會產生節稅效果。</div>`;
  }

  html += '<table class="table table-sm"><thead><tr><th>代號</th><th class="text-right">市值</th><th class="text-right">成本</th><th class="text-right">未實現損益</th></tr></thead><tbody>';
  for (const c of data.candidates) {
    html += `<tr>
      <td class="font-medium">${escapeHtml(c.symbol)}</td>
      <td class="text-right">$${c.market_value.toLocaleString('en-US', { maximumFractionDigits: 0 })}</td>
      <td class="text-right">$${c.cost_basis.toLocaleString('en-US', { maximumFractionDigits: 0 })}</td>
      <td class="text-right text-error">$${c.unrealized_loss.toLocaleString('en-US', { maximumFractionDigits: 0 })}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  content.innerHTML = html;
  makeSortable(content.querySelector('table'));
}
</script>
