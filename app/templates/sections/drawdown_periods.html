  <h2 id="section-drawdown-periods" class="flex items-center gap-2 text-lg font-bold mb-3">
    <span class="w-1.5 h-5 bg-primary rounded-full"></span>定投高點回本風險
  </h2>
  <div class="card bg-base-100 shadow-sm mb-8">
    <div class="card-body">
      <p class="text-xs opacity-60">
        掃描這檔標的完整歷史股價，列出每一次「買在高點、之後要等很久才回到原本高點」的熊市崩跌時間點跟區間，讓你檢視這檔標的過去曾經出現過哪些長期套牢的進場時機。只列出回本花費超過設定門檻的區間，排除正常的短期波動。純粹回顧歷史事實，不是預測。
      </p>
      <div class="flex flex-wrap items-end gap-2 mt-2">
        <div class="relative">
          <label class="text-xs opacity-60 block mb-1">標的</label>
          <input id="drawdown-symbol" placeholder="VOO" value="VOO" autocomplete="off" class="input input-bordered input-sm w-24">
          <ul id="drawdown-symbol-suggestions" class="absolute z-20 hidden menu bg-base-100 rounded-box shadow-md mt-1 w-56 max-h-56 overflow-y-auto flex-nowrap"></ul>
        </div>
        <div>
          <label class="text-xs opacity-60 block mb-1">回本要花超過</label>
          <div class="join">
            <button type="button" onclick="setDrawdownMinDays(90)" class="btn btn-sm join-item">3 個月</button>
            <button type="button" onclick="setDrawdownMinDays(180)" class="btn btn-sm join-item">半年</button>
            <button type="button" onclick="setDrawdownMinDays(365)" class="btn btn-sm join-item">1 年</button>
            <button type="button" onclick="setDrawdownMinDays(730)" class="btn btn-sm join-item">2 年</button>
          </div>
        </div>
        <div>
          <label class="text-xs opacity-60 block mb-1">自訂天數</label>
          <input id="drawdown-min-days" type="number" min="1" step="1" value="60" class="input input-bordered input-sm w-28">
        </div>
        <button type="button" onclick="loadDrawdownPeriods()" class="btn btn-neutral btn-sm">查詢</button>
      </div>
      <div id="drawdown-error" class="alert alert-error text-sm hidden mt-2"></div>
      <div id="drawdown-empty" class="text-xs opacity-60 mt-3 hidden">歷史區間內沒有符合條件的長期套牢時間點。</div>
      <div id="drawdown-probability" class="text-sm mt-3 hidden"></div>
      <div class="h-72 mt-4" id="drawdown-chart-wrap" style="display:none"><canvas id="drawdownChart"></canvas></div>
      <div class="overflow-x-auto mt-3">
        <table class="table table-sm" id="drawdown-table" style="display:none">
          <thead>
            <tr>
              <th>高點日期</th>
              <th class="text-right">高點價格</th>
              <th>最低點日期</th>
              <th class="text-right">最低點價格</th>
              <th class="text-right">最大跌幅</th>
              <th>回本日期</th>
              <th class="text-right">花費時間</th>
            </tr>
          </thead>
          <tbody id="drawdown-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
attachTickerAutocomplete('drawdown-symbol', 'drawdown-symbol-suggestions');
// --- 定投高點回本風險 ---
function fmtDurationDays(days) {
  let years = Math.floor(days / 365);
  let months = Math.round((days % 365) / 30);
  if (months === 12) { years += 1; months = 0; }
  if (years === 0) return `${months} 個月`;
  if (months === 0) return `${years} 年`;
  return `${years} 年 ${months} 個月`;
}

// 輕微 -> 嚴重的四級顏色標注，門檻對齊上面的快選按鈕（3個月/半年/1年/2年）。
function durationSeverityClass(days) {
  if (days < 90) return 'text-success';
  if (days < 365) return 'text-warning';
  if (days < 730) return 'text-error';
  return 'text-error font-bold';
}

function setDrawdownMinDays(days) {
  document.getElementById('drawdown-min-days').value = days;
  loadDrawdownPeriods();
}

let drawdownChart = null;

async function loadDrawdownPeriods() {
  const symbol = document.getElementById('drawdown-symbol').value.trim();
  const minDays = document.getElementById('drawdown-min-days').value || 60;
  const errorBox = document.getElementById('drawdown-error');
  const emptyBox = document.getElementById('drawdown-empty');
  const probBox = document.getElementById('drawdown-probability');
  const table = document.getElementById('drawdown-table');
  const chartWrap = document.getElementById('drawdown-chart-wrap');
  errorBox.classList.add('hidden');
  emptyBox.classList.add('hidden');
  probBox.classList.add('hidden');
  table.style.display = 'none';
  chartWrap.style.display = 'none';
  if (!symbol) return;

  const res = await fetch(`/api/drawdown-periods?symbol=${encodeURIComponent(symbol)}&min_duration_days=${minDays}`);
  const data = await res.json();
  if (data.error) {
    errorBox.textContent = data.error;
    errorBox.classList.remove('hidden');
    return;
  }

  if (data.episodes.length === 0) {
    emptyBox.classList.remove('hidden');
    return;
  }

  const tbody = document.getElementById('drawdown-tbody');
  tbody.innerHTML = data.episodes.map(ep => `
    <tr>
      <td>${escapeHtml(ep.peak_date)}</td>
      <td class="text-right">${fmtPrice(ep.peak_price)}</td>
      <td>${escapeHtml(ep.trough_date)}</td>
      <td class="text-right">${fmtPrice(ep.trough_price)}</td>
      <td class="text-right text-error">${fmtPct(ep.max_drawdown_pct)}</td>
      <td>${ep.recovered ? escapeHtml(ep.recovery_date) : '<span class="opacity-60">尚未回本</span>'}</td>
      <td class="text-right ${durationSeverityClass(ep.duration_days)}">${fmtDurationDays(ep.duration_days)}</td>
    </tr>
  `).join('');
  table.style.display = '';

  probBox.innerHTML = `這段歷史（${escapeHtml(data.start_date)} ~ ${escapeHtml(data.end_date)}，共 ${data.total_days} 天）裡，隨機挑一天買進，大約有 ` +
    `<b class="text-error">${(data.buy_in_crash_probability * 100).toFixed(1)}%</b> 的機率會買在上面列出的熊市崩跌區間內` +
    `（${data.days_in_drawdown} / ${data.total_days} 天）。`;
  probBox.classList.remove('hidden');

  // Shade each qualifying episode's peak-to-recovery range on the price
  // line and mark the peak/trough points; hovering anywhere in that range
  // (index mode) surfaces the matching point's detail via afterLabel.
  const annotations = {};
  const detailsByDate = {};
  data.episodes.forEach((ep, i) => {
    annotations[`range${i}`] = {
      type: 'box', xMin: ep.peak_date, xMax: ep.recovery_date || data.end_date,
      backgroundColor: 'rgba(244, 63, 94, 0.08)', borderWidth: 0,
    };
    annotations[`peak${i}`] = {
      type: 'point', xValue: ep.peak_date, yValue: ep.peak_price,
      backgroundColor: '#f43f5e', radius: 4, borderWidth: 0,
    };
    annotations[`trough${i}`] = {
      type: 'point', xValue: ep.trough_date, yValue: ep.trough_price,
      backgroundColor: '#f43f5e', radius: 4, borderWidth: 0,
    };
    detailsByDate[ep.peak_date] = `熊市高點：${fmtPrice(ep.peak_price)}`;
    detailsByDate[ep.trough_date] = `熊市低點：${fmtPrice(ep.trough_price)}（跌 ${fmtPct(ep.max_drawdown_pct)}）， ` +
      (ep.recovered ? `${ep.recovery_date} 回本，花了 ${fmtDurationDays(ep.duration_days)}` : '尚未回本');
  });

  if (drawdownChart) drawdownChart.destroy();
  drawdownChart = new Chart(document.getElementById('drawdownChart'), {
    type: 'line',
    data: {
      labels: data.dates,
      datasets: [{ label: data.symbol, data: data.prices, borderWidth: 1.2, pointRadius: 0, borderColor: '#4f46e5' }],
    },
    options: {
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: { x: { ticks: { maxTicksLimit: 10 } } },
      plugins: {
        annotation: { annotations },
        tooltip: {
          callbacks: {
            label: (ctx) => ` ${fmtPrice(ctx.parsed.y)}`,
            afterLabel: (ctx) => detailsByDate[ctx.label] || '',
          },
        },
      },
    },
  });
  chartWrap.style.display = '';
}

loadDrawdownPeriods();
</script>
