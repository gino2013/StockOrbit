services:
  - type: web
    name: stockorbit
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FT_USERNAME
        sync: false
      - key: FT_PASSWORD
        sync: false
      - key: FT_MFA_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      # --- multi-user (see docs/multi-user-architecture.md) ---
      # APP_SECRET_KEY: REQUIRED now (auth is wired) - signs session cookies, >= 32 chars.
      - key: APP_SECRET_KEY
        sync: false
      # OWNER_EMAIL / OWNER_INITIAL_PASSWORD: the account that keeps the FT_* env auto-sync.
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_INITIAL_PASSWORD
        sync: false
      # FT_CREDENTIAL_KEY: Fernet key for per-user Firstrade credential storage.
      # Unset -> per-user Firstrade sync is disabled. Keep separate from APP_SECRET_KEY.
      - key: FT_CREDENTIAL_KEY
        sync: false
      # GH_ACTIONS_TOKEN: fine-grained GitHub PAT, Actions:write on this repo
      # only. Lets a first-time stock-lookup symbol trigger
      # refresh-fundamentals-cache.yml immediately instead of waiting for its
      # schedule. Unset -> that symbol just waits for the next scheduled run.
      - key: GH_ACTIONS_TOKEN
        sync: false
      # SMTP_*: sends the email-verification and password-reset mails.
      # Unset -> mailer just logs the message (registration still works; the
      # owner can read the pending verification link from the deploy log).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # REQUIRE_EMAIL_VERIFICATION: default true. Set to "false" to let
      # unverified users use the Firstrade form / CSV import when no SMTP
      # sender is configured (widens the open-registration abuse surface).
      - key: REQUIRE_EMAIL_VERIFICATION
        sync: false
    # DB migrations are run by hand for now (free tier). On the existing prod DB, once:
    #   alembic stamp 0001_baseline && alembic upgrade head
    # then re-run `alembic upgrade head` after each future schema change.
