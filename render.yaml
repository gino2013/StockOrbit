services:
  - type: web
    name: stockorbit
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FT_USERNAME
        sync: false
      - key: FT_PASSWORD
        sync: false
      - key: FT_MFA_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      # --- multi-user (see docs/multi-user-architecture.md) ---
      # APP_SECRET_KEY: REQUIRED now (auth is wired) - signs session cookies, >= 32 chars.
      - key: APP_SECRET_KEY
        sync: false
      # OWNER_EMAIL / OWNER_INITIAL_PASSWORD: the account that keeps the FT_* env auto-sync.
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_INITIAL_PASSWORD
        sync: false
      # FT_CREDENTIAL_KEY: Fernet key for per-user Firstrade credential storage.
      # Unset -> per-user Firstrade sync is disabled. Keep separate from APP_SECRET_KEY.
      - key: FT_CREDENTIAL_KEY
        sync: false
    # DB migrations are run by hand for now (free tier). On the existing prod DB, once:
    #   alembic stamp 0001_baseline && alembic upgrade head
    # then re-run `alembic upgrade head` after each future schema change.
