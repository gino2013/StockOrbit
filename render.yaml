services:
  - type: web
    name: stockorbit
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FT_USERNAME
        sync: false
      - key: FT_PASSWORD
        sync: false
      - key: FT_MFA_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      # --- multi-user (see docs/multi-user-architecture.md) ---
      # APP_SECRET_KEY: signs session cookies; >= 32 chars. Required once auth is wired.
      - key: APP_SECRET_KEY
        sync: false
      # OWNER_EMAIL: the account that keeps the FT_* env-credential auto-sync.
      - key: OWNER_EMAIL
        sync: false
      # FT_CREDENTIAL_KEY: Fernet key for per-user Firstrade credential storage.
      # Unset -> per-user Firstrade sync is disabled. Keep separate from APP_SECRET_KEY.
      - key: FT_CREDENTIAL_KEY
        sync: false
    # buildCommand gains `&& alembic upgrade head` in the step-2 PR, AFTER a
    # one-time `alembic stamp 0001_baseline` on the existing prod DB (its
    # tables already exist and 0001 would try to re-create them).
